name: Build Madar Messenger (Final Complete)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-madar-android-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deep Rebrand UI/UX to Madar & Inject Cloudflare Bridge
        run: |
          # ۱. اتصال تمام دیتاسنترها به پل کلادفلر اختصاصی شما
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/kws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/zws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +

          # ۲. جایگزینی کامل کلمات Telegram و تلگرام با Madar و مدار در کل UI/UX برنامه
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" -o -name "*.webmanifest" \) -exec sed -i 's/Telegram Web/Madar Messenger/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" -o -name "*.webmanifest" \) -exec sed -i 's/Telegram/Madar/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" -o -name "*.webmanifest" \) -exec sed -i 's/تلگرام/مدار/g' {} +

      - name: Upload Ready Web App
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Web-App
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK (.apk)
        run: |
          mkdir madar-apk
          cp -r dist madar-apk/www
          cd madar-apk
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Madar" "com.madar.messenger" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Madar Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Android-APK
          path: madar-apk/android/app/build/outputs/apk/debug/*.apk

  build-madar-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deep Rebrand UI/UX for Windows
        shell: bash
        run: |
          find dist -type f \( -name "*.js" -o -name "*.html" \) -exec sed -i 's/kws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" \) -exec sed -i 's/zws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" \) -exec sed -i 's/Telegram/Madar/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" \) -exec sed -i 's/تلگرام/مدار/g' {} +
          sed -i 's/"beforeBuildCommand":.*/"beforeBuildCommand": "",/g' tauri/tauri.conf.json || true
          sed -i 's/"productName":.*/"productName": "Madar",/g' tauri/tauri.conf.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Windows Executable
        run: |
          npx --yes @tauri-apps/cli@latest build --config tauri/tauri.conf.json || true

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Windows-EXE
          path: |
            tauri/target/release/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
        continue-on-error: true
