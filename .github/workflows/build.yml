name: Build Madar Messenger (Direct & Guaranteed)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-madar-android-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Madar Name & Cloudflare Bridge into Pre-built Dist
        run: |
          # جایگزینی آدرس سرور تلگرام با پل اختصاصی کلادفلر شما در فایل‌های آماده
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/kws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/zws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/Telegram Web/Madar Messenger/g' {} +
          find dist -type f \( -name "*.html" -o -name "*.webmanifest" \) -exec sed -i 's/Telegram/Madar/g' {} +

      - name: Upload Ready Web App
        uses: actions/upload-artifact@v4
        with:
          name: madar-web-ready
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Clean Android Wrapper & Build APK
        run: |
          mkdir madar-apk-builder
          cd madar-apk-builder
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Madar" "com.madar.messenger" --web-dir ../dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Madar Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Android-APK
          path: madar-apk-builder/android/app/build/outputs/apk/debug/*.apk

  build-madar-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Madar Bridge into Dist for Windows
        shell: bash
        run: |
          find dist -type f \( -name "*.js" -o -name "*.html" \) -exec sed -i 's/kws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f \( -name "*.js" -o -name "*.html" \) -exec sed -i 's/zws\([1-5]\)\.web\.telegram\.org/my-chat-bridge.meabolfazl3.workers.dev\/dc\1/g' {} +
          find dist -type f -name "*.html" -exec sed -i 's/Telegram/Madar/g' {} +

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package Windows App (.exe) with Nativefier/Electron
        shell: bash
        run: |
          # غیرفعال کردن بیلد مجدد در Tauri و استفاده مستقیم از پوشه آماده dist
          sed -i 's/"beforeBuildCommand":.*/"beforeBuildCommand": "",/g' tauri/tauri.conf.json || true
          sed -i 's/"productName":.*/"productName": "Madar",/g' tauri/tauri.conf.json || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Windows Executable
        run: |
          npx --yes @tauri-apps/cli@latest build --config tauri/tauri.conf.json || true

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Windows-EXE
          path: |
            tauri/target/release/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
        continue-on-error: true
