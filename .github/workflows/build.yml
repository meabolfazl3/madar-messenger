name: Build Madar Messenger

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build
        env:
          TG_APP_NAME: "Madar"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madar-web-build
          path: dist/

  build-windows:
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust for Tauri
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri Windows App (.exe)
        run: npm run tauri build || true

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: madar-windows-exe
          path: |
            tauri/target/release/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
        continue-on-error: true
