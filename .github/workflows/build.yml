name: Build Madar Messenger (Android & Windows)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git for SSH dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://".insteadOf "git://"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: ""

      - name: Add Build Alias Script
        run: npm pkg set scripts.build="npm run build:bundle"

      - name: Build Web Application
        run: npm run build:bundle || npx vite build
        env:
          TG_APP_NAME: "Madar"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madar-web-build
          path: dist/

  build-android-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: madar-web-build
          path: dist

      - name: Setup Capacitor & Prepare Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Madar" "com.madar.messenger" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK (.apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-windows:
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust for Tauri
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Add Build Alias Script
        run: npm pkg set scripts.build="npm run build:bundle"

      - name: Build Tauri Windows App (.exe)
        run: npm run tauri build || true

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: madar-windows-exe
          path: |
            tauri/target/release/*.exe
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
        continue-on-error: true
